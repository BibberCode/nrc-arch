name: build-matrix

# Hält die letzten 5 wichtigen Upstream-Releases als Arch-Pakete vor:
# neuestes Stable garantiert + neueste mit Linux-.deb (siehe scripts/build-matrix.py).
# Baut jede Version isoliert, veröffentlicht fehlende arch-v*-Releases und
# synchronisiert das pacman-Repo (gh-pages) mit allen 5 Paketen.
# Roter Build einer Version -> nur diese wird nicht veröffentlicht.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-publish
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sel.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: sel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build-matrix.py --matrix --count 5 --token "$GITHUB_TOKEN" | tee /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.select.outputs.matrix).version }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - name: Build-Deps
        run: pacman -Syu --noconfirm --needed namcap desktop-file-utils sudo git
      - name: builder-User anlegen (makepkg verbietet Root)
        run: |
          id builder >/dev/null 2>&1 || useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Paketverzeichnis isoliert patchen
        env:
          UPSTREAMVER: ${{ matrix.version.upstreamver }}
          PKGVER: ${{ matrix.version.pkgver }}
          SHA256: ${{ matrix.version.sha256 }}
        run: |
          rm -rf "$GITHUB_WORKSPACE/.matrix-build" "$GITHUB_WORKSPACE/.matrix-out"
          mkdir -p "$GITHUB_WORKSPACE/.matrix-build" "$GITHUB_WORKSPACE/.matrix-out"
          cp -r no-risk-launcher "$GITHUB_WORKSPACE/.matrix-build/pkg"
          python3 - "$GITHUB_WORKSPACE/.matrix-build/pkg/PKGBUILD" <<'EOF'
          import re, sys
          import os
          p = sys.argv[1]
          t = open(p).read()
          t = re.sub(r"^_upstreamver=.*$", f"_upstreamver={os.environ['UPSTREAMVER']}", t, flags=re.M)
          t = re.sub(r"^pkgver=.*$", f"pkgver={os.environ['PKGVER']}", t, flags=re.M)
          t = re.sub(r"^pkgrel=.*$", "pkgrel=1", t, flags=re.M)
          t = re.sub(r"^sha256sums=\('[0-9a-f]{64}'\)$", f"sha256sums=('{os.environ['SHA256']}')", t, flags=re.M)
          open(p, "w").write(t)
          EOF
          grep -E "^_upstreamver|^pkgver|^pkgrel|sha256sums" "$GITHUB_WORKSPACE/.matrix-build/pkg/PKGBUILD"
          chown -R builder:builder "$GITHUB_WORKSPACE/.matrix-build" "$GITHUB_WORKSPACE/.matrix-out"
      - name: Bauen als builder
        run: su builder -c "cd '$GITHUB_WORKSPACE/.matrix-build/pkg' && makepkg -s --noconfirm --noprogressbar"
      - name: Tests (namcap, Desktop, WMClass)
        run: |
          cd "$GITHUB_WORKSPACE/.matrix-build/pkg"
          pkg=$(echo no-risk-launcher-*.pkg.tar.zst)
          namcap PKGBUILD
          namcap "$pkg"
          tmp=$(mktemp -d)
          bsdtar -xf "$pkg" -C "$tmp"
          grep -q '^StartupWMClass=noriskclient-launcher-v3$' "$tmp"/usr/share/applications/*.desktop
          ! grep -q '^Categories=$' "$tmp"/usr/share/applications/*.desktop
          desktop-file-validate "$tmp"/usr/share/applications/*.desktop
          test -x "$tmp/usr/bin/noriskclient-launcher-v3"
          rm -rf "$tmp"
          mv "$pkg" "$GITHUB_WORKSPACE/.matrix-out/"
      - uses: actions/upload-artifact@v5
        with:
          name: pkg-${{ matrix.version.pkgver }}
          path: .matrix-out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [select, build]
    if: success()
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          path: /tmp/mpks
          merge-multiple: true
      - name: Fehlende arch-v*-Releases anlegen (bestehende überspringen)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -Syu --noconfirm --needed github-cli
          for pkg in /tmp/mpks/no-risk-launcher-*.pkg.tar.zst; do
            base=$(basename "$pkg")
            pkgver=${base#no-risk-launcher-}
            pkgver=${pkgver%-1-x86_64.pkg.tar.zst}
            tag="arch-v${pkgver}-1"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag existiert, überspringe"
            else
              echo "Erstelle Release $tag"
              gh release create "$tag" --title "no-risk-launcher ${pkgver}" \
                --notes "Arch-Paket aus offiziellem Upstream-.deb (SHA256-geprüft). Install: install.sh aus diesem Release laden, dann bash install.sh. Versionen: --channel / --version in install.sh." \
                "$pkg" install.sh
            fi
          done
      - name: pacman-Repo mit allen 5 Paketen synchronisieren (gh-pages)
        run: |
          pacman -Syu --noconfirm --needed git
          mkdir -p /tmp/pacrepo/x86_64
          cp /tmp/mpks/*.pkg.tar.zst /tmp/pacrepo/x86_64/
          cd /tmp/pacrepo/x86_64
          repo-add norisk.db.tar.zst *.pkg.tar.zst
          cd "$GITHUB_WORKSPACE"
          git fetch origin gh-pages:gh-pages || true
          git worktree add /tmp/ghpages gh-pages 2>/dev/null || (git checkout -b gh-pages && git worktree add /tmp/ghpages gh-pages)
          mkdir -p /tmp/ghpages/x86_64
          cp /tmp/pacrepo/x86_64/* /tmp/ghpages/x86_64/
          cd /tmp/ghpages
          git add x86_64
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "repo: matrix mit 5 Versionen" || true
          git push origin gh-pages
